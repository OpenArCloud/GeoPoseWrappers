<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568" role="img" aria-labelledby="title desc">
<title id="title">Positive right-handed yaw in an ENU tangent plane</title>
<desc id="desc">Two top views: at zero yaw, x points East and y points North. At positive 90-degree yaw, x points North and y points West. z stays Up toward the viewer. The curved arrow runs counterclockwise from East to North.</desc>
