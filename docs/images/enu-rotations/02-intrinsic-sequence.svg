<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="title desc">
<title id="title">Intrinsic yaw, pitch and roll sequence in ENU</title>
<desc id="desc">Four exact projected frames: identity; yaw 90 degrees; yaw 90 and pitch 45 degrees; yaw 90, pitch 45 and roll 90 degrees. Pitch is about the rotated y axis pointing West. Roll is about the rotated x axis pointing North and down. The fixed ENU tangent plane remains visible in every panel.</desc>
